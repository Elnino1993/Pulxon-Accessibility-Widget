name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  widget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint, typecheck, unit tests, build, size, package lint
        working-directory: packages/widget
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm size
          pnpm publint
      - name: E2E
        working-directory: packages/widget
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm e2e
